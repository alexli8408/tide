name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race detector on)
        run: go test ./... -race -coverprofile=cover.out
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

  verify-generated:
    name: Generated code is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Regenerate deepcopy, CRD, RBAC
        run: make generate
      - name: Fail if generation changed anything
        # git add -N registers newly created files so the diff catches them
        # too; plain git diff ignores untracked files.
        run: |
          git add -N api config
          git diff --exit-code -- api config
      - name: Kustomize overlay builds
        # Regression check for the load-restrictor breakage that once made
        # 'make deploy' fail; kubectl ships on the ubuntu runner image.
        run: kubectl kustomize config/default > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t tide:ci .
