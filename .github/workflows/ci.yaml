name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race detector on)
        run: go test ./... -race -coverprofile=cover.out
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

  verify-generated:
    name: Generated code is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate deepcopy, CRD, RBAC
        run: make generate
      - name: Fail if generation changed anything
        run: git diff --exit-code -- api config

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tide:ci .
