# Leader election needs write access to Leases, but only inside the
# controller's own namespace — hence a Role, not a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tide-leader-election-role
  namespace: tide-system
  labels:
    app.kubernetes.io/name: tide
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tide-leader-election-rolebinding
  namespace: tide-system
  labels:
    app.kubernetes.io/name: tide
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tide-leader-election-role
subjects:
  - kind: ServiceAccount
    name: tide-controller-manager
    namespace: tide-system
