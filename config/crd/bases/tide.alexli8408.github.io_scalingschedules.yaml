---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: scalingschedules.tide.alexli8408.github.io
spec:
  group: tide.alexli8408.github.io
  names:
    kind: ScalingSchedule
    listKind: ScalingScheduleList
    plural: scalingschedules
    shortNames:
    - ssc
    singular: scalingschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.desiredReplicas
      name: Desired
      type: integer
    - jsonPath: .status.activeWindow
      name: Window
      type: string
    - jsonPath: .status.nextTransitionTime
      name: Next
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScalingSchedule scales one workload on a recurring weekly schedule.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScalingScheduleSpec declares the desired scaling behaviour
              for one workload.
            properties:
              defaultReplicas:
                description: |-
                  DefaultReplicas is the replica count applied whenever no window is
                  active.
                format: int32
                minimum: 0
                type: integer
              scaleDownDelay:
                description: |-
                  ScaleDownDelay keeps the higher replica count for this long after the
                  schedule calls for fewer replicas — a cool-down that avoids churn at
                  window boundaries and lets in-flight work drain. Scale-ups are never
                  delayed. A duration string like "10m" or "1h30m", at most 24h.
                type: string
              suspend:
                description: |-
                  Suspend stops the controller from scaling the target while true.
                  Status is still reported so a suspended schedule shows what it *would*
                  do.
                type: boolean
              targetRef:
                description: |-
                  TargetRef names the workload to scale, in the same namespace as this
                  ScalingSchedule.
                properties:
                  kind:
                    default: Deployment
                    description: Kind of the target workload.
                    enum:
                    - Deployment
                    - StatefulSet
                    type: string
                  name:
                    description: Name of the target workload.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              timeZone:
                default: UTC
                description: |-
                  TimeZone is an IANA timezone name (for example "America/Toronto") used
                  to interpret window start and end times. Daylight-saving transitions
                  are handled by the timezone database, not by the schedule author.
                type: string
              windows:
                description: |-
                  Windows are the recurring time windows that override DefaultReplicas.
                  When windows overlap, the highest replica count wins, so a schedule can
                  never accidentally scale a workload below what another active window
                  asked for.
                items:
                  description: |-
                    ScalingWindow is a recurring weekly time window during which the target is
                    held at a specific replica count.
                  properties:
                    days:
                      description: |-
                        Days of the week on which this window starts. A window that wraps past
                        midnight belongs to the day it starts on: a Fri 22:00–02:00 window ends
                        Saturday at 02:00.
                      items:
                        description: DayOfWeek is a three-letter English day-of-week
                          name.
                        enum:
                        - Mon
                        - Tue
                        - Wed
                        - Thu
                        - Fri
                        - Sat
                        - Sun
                        type: string
                      maxItems: 7
                      minItems: 1
                      type: array
                    end:
                      description: |-
                        End of the window as 24-hour "HH:MM" wall-clock time. If End is not
                        later than Start, the window wraps past midnight into the next day.
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                    name:
                      description: Name identifies this window in status fields and
                        events.
                      maxLength: 63
                      minLength: 1
                      type: string
                    replicas:
                      description: Replicas the target is held at while this window
                        is active.
                      format: int32
                      minimum: 0
                      type: integer
                    start:
                      description: |-
                        Start of the window as 24-hour "HH:MM" wall-clock time in the
                        schedule's timezone.
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                  required:
                  - days
                  - end
                  - name
                  - replicas
                  - start
                  type: object
                maxItems: 32
                type: array
            required:
            - defaultReplicas
            - targetRef
            type: object
          status:
            description: ScalingScheduleStatus is the observed state of a ScalingSchedule.
            properties:
              activeWindow:
                description: |-
                  ActiveWindow is the name of the window currently deciding the replica
                  count, or empty when DefaultReplicas applies.
                type: string
              conditions:
                description: Conditions describe the current state of the schedule.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredReplicas:
                description: DesiredReplicas is the replica count the schedule currently
                  calls for.
                format: int32
                type: integer
              lastScaleTime:
                description: |-
                  LastScaleTime is when the controller last changed the target's replica
                  count.
                format: date-time
                type: string
              nextTransitionTime:
                description: |-
                  NextTransitionTime is when the desired replica count next changes; the
                  controller re-reconciles itself at this instant.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
